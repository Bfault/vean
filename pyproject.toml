[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vean"
version = "0.1.0"
description = "Data pipeline and vector indexing engine for Lean 4 / Mathlib4"
license = { text = "AGPL-3.0" }
requires-python = ">=3.10"
dependencies = [
    "orjson>=3.0",
    "tqdm>=4.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
